name: check-dist
# dist/index.js is the code GitHub runs for `uses:`; it MUST equal a clean rebuild of src/ (actions/typescript-action).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Rebuild dist/
        run: |
          rm -rf dist
          npm run build
      - name: Compare dist/ with the committed copy
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is stale: run 'npm run build' and commit the result"
            git status --short -- dist/
            git diff --ignore-space-at-eol --stat -- dist/
            exit 1
          fi
      - if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
