name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
  self-test:
    # Runs the built action from this repository against a mocked pull_request event: STOP + dry-run holds with no API call.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Write a mocked pull_request event
        run: |
          printf '%s' '{"pull_request":{"number":7,"state":"open","draft":false,"labels":[],"head":{"ref":"feat","sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","repo":{"full_name":"example/repo"}},"base":{"repo":{"full_name":"example/repo"}}}}' > "$RUNNER_TEMP/event.json"
      - name: Run the built action on the mocked event
        # Not `uses: ./`: the runner replaces GITHUB_EVENT_PATH with the real event, so a draft pull request read as draft and skipped.
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: ${{ runner.temp }}/event.json
          GITHUB_REPOSITORY: example/repo
          GITHUB_OUTPUT: ${{ runner.temp }}/outputs.txt
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/summary.md
          INPUT_WORKFLOW: ci.yml
          INPUT_MODE: stop
          INPUT_DEDUPE: 'true'
          INPUT_ENABLED-MODES: FULL_AHEAD,HALF_AHEAD,SLOW_AHEAD,DEAD_SLOW,STANDBY,STOP
          INPUT_ON-COUNT-ERROR: hold
          INPUT_DISPATCH-INPUTS: '{}'
          INPUT_PR-INPUT: pr
          INPUT_FAILFAST-INPUT: failfast
          INPUT_FAILFAST-MODES: SLOW_AHEAD
          INPUT_DRY-RUN: 'true'
          INPUT_TOKEN: unused-no-api-call-is-made
        run: |
          : > "$GITHUB_OUTPUT"
          : > "$GITHUB_STEP_SUMMARY"
          node dist/index.js
      - name: Assert the outputs, defaults included
        run: |
          grep -A1 '^decision<<' "$RUNNER_TEMP/outputs.txt" | grep -qx hold
          grep -A1 '^mode<<' "$RUNNER_TEMP/outputs.txt" | grep -qx STOP
