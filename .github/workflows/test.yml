name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
  self-test:
    # Runs the built action from this repository against a mocked pull_request event: STOP + dry-run holds with no API call.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Write a mocked pull_request event
        run: |
          printf '%s' '{"pull_request":{"number":7,"state":"open","draft":false,"labels":[],"head":{"ref":"feat","sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","repo":{"full_name":"example/repo"}},"base":{"repo":{"full_name":"example/repo"}}}}' > "$RUNNER_TEMP/event.json"
      - name: Run the built action on the mocked event
        # Not GITHUB_EVENT_PATH / GITHUB_OUTPUT overrides: the runner owns GITHUB_*. The event comes in by the event-path input; outputs are read from the runner's own "$GITHUB_OUTPUT" in this same step.
        env:
          INPUT_EVENT-PATH: ${{ runner.temp }}/event.json
          INPUT_WORKFLOW: ci.yml
          INPUT_MODE: stop
          INPUT_DEDUPE: 'true'
          INPUT_ENABLED-MODES: FULL_AHEAD,HALF_AHEAD,SLOW_AHEAD,DEAD_SLOW,STANDBY,STOP
          INPUT_ON-COUNT-ERROR: hold
          INPUT_DISPATCH-INPUTS: '{}'
          INPUT_PR-INPUT: pr
          INPUT_FAILFAST-INPUT: failfast
          INPUT_FAILFAST-MODES: SLOW_AHEAD
          INPUT_DRY-RUN: 'true'
          INPUT_TOKEN: unused-no-api-call-is-made
        run: |
          node dist/index.js
          grep -A1 '^decision<<' "$GITHUB_OUTPUT" | grep -qx hold
          grep -A1 '^mode<<' "$GITHUB_OUTPUT" | grep -qx STOP
      - name: Run uses ./ on the mocked event (parses action.yml; runs on drafts too)
        id: forge
        uses: ./
        with:
          event-path: ${{ runner.temp }}/event.json
          workflow: ci.yml
          mode: stop
          dry-run: 'true'
          token: ${{ github.token }}
      - name: Assert the uses ./ step outputs
        env:
          DECISION: ${{ steps.forge.outputs.decision }}
          MODE: ${{ steps.forge.outputs.mode }}
          DISPATCHED: ${{ steps.forge.outputs.dispatched }}
        run: |
          test "$DECISION" = hold
          test "$MODE" = STOP
          test "$DISPATCHED" = false
