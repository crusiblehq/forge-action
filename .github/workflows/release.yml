name: release
# A forge master publishes a vX.Y.Z release. This workflow rebuilds, verifies dist/, attests it, and moves the major tag (v1).
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: write # move the floating major tag
      id-token: write # build provenance
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify the tag is on main and matches package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          [ "v$(node -p "require('./package.json').version")" = "$TAG" ] || { echo "::error::package.json version differs from $TAG"; exit 1; }
      - run: npm ci
      - run: npm run coverage
      - name: Verify dist/ equals a clean rebuild
        run: |
          rm -rf dist
          npm run build
          git diff --exit-code -- dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/index.js
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The token is used only here, after npm ci and the build have run without it.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force origin "refs/tags/$major"
