name: Forge
description: Gate and dispatch a heavy CI workflow per pull request by CI mode, bypass labels and per-label caps.
author: Crusible
branding:
  icon: shield
  color: orange

inputs:
  op:
    description: >-
      Run one GitHub operation instead of the gate: status, label, dispatch, files, ref, commit, tree, blob, pulls, runs or runners. Empty = gate mode.
      Op mode uses the token, workflow, ref, repository, pr and the inputs below, and sets the outputs verdict and ok.
    required: false
    default: ''
  repository:
    description: owner/name for an op. Default is the running repository.
    required: false
    default: ''
  pr:
    description: Pull request number (op label, dispatch, pulls).
    required: false
    default: ''
  sha:
    description: Commit, tree or blob sha (op status, commit, tree, runs head_sha).
    required: false
    default: ''
  state:
    description: 'op status: pending, success, failure or error. Empty = read the context.'
    required: false
    default: ''
  context:
    description: Commit status context (op status).
    required: false
    default: ''
  description:
    description: Commit status description, cut at 140 characters (op status).
    required: false
    default: ''
  target-url:
    description: Commit status target URL (op status).
    required: false
    default: ''
  wait-seconds:
    description: op status read only. Poll up to this many seconds, in three equal steps.
    required: false
    default: ''
  labels:
    description: 'op label: labels to add. runners: labels to count.'
    required: false
    default: ''
  remove-labels:
    description: Labels to remove (op label).
    required: false
    default: ''
  inputs:
    description: JSON object of workflow_dispatch inputs (op dispatch).
    required: false
    default: ''
  gates:
    description: One string input sent as inputs.gates, at most 4096 bytes (op dispatch).
    required: false
    default: ''
  paths:
    description: 'op files: repository paths. tree: path prefixes to keep. blob: lines of path=blobsha. Comma or newline list.'
    required: false
    default: ''
  dest:
    description: Directory the files and blob ops write under.
    required: false
    default: ''
  event:
    description: Event filter (op runs).
    required: false
    default: ''
  status:
    description: Run status filter (op runs).
    required: false
    default: ''
  base:
    description: Base branch filter (op pulls list).
    required: false
    default: ''
  recursive:
    description: op tree only. true reads a subtree recursively; refused on a commit sha.
    required: false
    default: ''
  max-entries:
    description: op tree only. Fail when the tree has more entries. Default 3000.
    required: false
    default: ''
  run:
    description: op run-jobs. Workflow run id.
    required: false
    default: ''
  attempt:
    description: op run-jobs. Run attempt; default the latest.
    required: false
    default: ''
  lanes:
    description: op lane-last-green. Comma or newline list of lane (job) names.
    required: false
    default: ''
  max-runs:
    description: op lane-last-green. Newest runs scanned, at most 100. Default 30.
    required: false
    default: ''
  delay-seconds:
    description: op pr-state. Pause between the head and mergeable re-reads, at most 60. Default 12.
    required: false
    default: ''
  max-pages:
    description: op pulls list, runs, runners. Fail when more than this many pages of 100.
    required: false
    default: ''
  cache:
    description: op blob only. Directory keyed by blob sha, shared across steps, so a sha is fetched once per pass.
    required: false
    default: ''
  scope:
    description: op runners only. org (default, needs administration read) or repo.
    required: false
    default: ''
  retry-unknown-inputs:
    description: op dispatch only. On a 422 naming unexpected inputs, redispatch once without them. Set false to disable.
    required: false
    default: 'true'
  workflow:
    description: File name or id of the workflow to dispatch, for example ci.yml. It needs an on.workflow_dispatch trigger. Required in gate mode and for op dispatch.
    required: false
  mode:
    description: >-
      The CI mode, from a repo or org variable. One of FULL_AHEAD, HALF_AHEAD, SLOW_AHEAD,
      DEAD_SLOW, STANDBY, STOP. Empty = FULL_AHEAD. An unknown value = SLOW_AHEAD with a warning.
    required: false
    default: ''
  enabled-modes:
    description: >-
      Comma list of the modes this repository uses, case-insensitive. Default: all six. An empty value fails the step.
      A mode outside the list fails safe to the nearest more restrictive enabled mode.
    required: false
    default: 'FULL_AHEAD,HALF_AHEAD,SLOW_AHEAD,DEAD_SLOW,STANDBY,STOP'
  bypass-labels:
    description: >-
      Labels that let a pull request through STANDBY and past the caps. A comma means OR, a plus means AND inside an
      entry, for example pod:a+priority:urgent,priority:blocker. STOP still blocks. Empty = nobody bypasses.
    required: false
    default: ''
  limit-by-label:
    description: >-
      JSON array from a repo variable: [{"label":"pod:*","modes":{"SLOW_AHEAD":3}}]. Caps ready pull requests per
      matching label per mode. First matching entry wins; glob * allowed. Empty = no caps.
    required: false
    default: ''
  on-count-error:
    description: What to do when the ready count cannot be read after two retries, hold or dispatch.
    required: false
    default: 'hold'
  ref:
    description: Ref to dispatch (op dispatch requires it). Gate-mode default is the pull request head branch (same-repository pull requests only).
    required: false
    default: ''
  dispatch-inputs:
    description: JSON object merged into the workflow_dispatch inputs.
    required: false
    default: '{}'
  pr-input:
    description: Name of the dispatch input that receives the pull request number. Empty = not sent.
    required: false
    default: 'pr'
  failfast-input:
    description: Name of the dispatch input that receives true or false. Empty = not sent.
    required: false
    default: 'failfast'
  failfast-modes:
    description: Comma list of modes whose dispatch sets failfast=true.
    required: false
    default: 'SLOW_AHEAD'
  runs-on-input:
    description: Name of the dispatch input that receives the runner hint as JSON. Empty = not sent.
    required: false
    default: ''
  runs-on-default:
    description: Runner hint sent normally.
    required: false
    default: ''
  runs-on-overflow:
    description: Runner hint sent in DEAD_SLOW.
    required: false
    default: ''
  held-label:
    description: Label added to a held pull request and removed on dispatch. Needs pull-requests write. Empty = no label write.
    required: false
    default: ''
  dedupe:
    description: Skip when a dispatched run for this head SHA is queued, running or green.
    required: false
    default: 'true'
  dry-run:
    description: Decide and report, but dispatch and label nothing.
    required: false
    default: 'false'
  event-path:
    description: Path to a JSON pull_request event to decide on instead of the running event. For tests; the runner does not let a step override GITHUB_EVENT_PATH. Empty = the running event.
    required: false
    default: ''
  token:
    description: The job token, passed explicitly, for example the workflow GITHUB_TOKEN. There is no default, so a step never runs on a token it did not name. A personal access token is unsupported.
    required: true

outputs:
  verdict:
    description: Op mode. JSON verdict; always has "verdict" (ok, absent or unreadable).
  ok:
    description: Op mode. true when the op succeeded and found what it asked for.
  decision:
    description: dispatch, hold or skip.
  reason:
    description: One line explaining the decision.
  mode:
    description: The mode in force after enabled-modes fail-safe.
  bucket:
    description: The label bucket the cap was checked against, if any.
  ready-count:
    description: Ready pull requests in the bucket, this one included.
  cap:
    description: The cap that applied, empty when none.
  rank:
    description: This pull request's rank in the bucket by number.
  privileged:
    description: true when a bypass label rule matched.
  dispatched:
    description: true when the workflow was dispatched.
  failfast:
    description: true when the dispatch carries failfast.
  runs-on:
    description: Runner hint as a JSON string.
  head-sha:
    description: The pull request head SHA.
  held-label:
    description: The label written on a hold, empty if none.

runs:
  using: node24
  main: dist/index.js
